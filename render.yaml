# Render Blueprint — https://render.com/docs/blueprint-spec
#
# کد همیشه از داخل ایمیج (/opt/jafj) اجرا می‌شود و دیسک فقط داده‌ها را
# نگه می‌دارد (/data). دیسک را هرگز روی /app یا /opt/jafj مانت نکن؛
# دیسکِ مانت‌شده روی مسیرِ کد، کدِ ایمیج را پنهان می‌کند و هر دیپلوی
# بی‌اثر می‌شود.
services:
  - type: worker
    name: jafj
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    envVars:
      - key: DATA_DIR
        value: /data
      - key: JAFJ_IMAGE_DIR
        value: /opt/jafj
      - key: JAFJ_APP_DIR
        value: /data
      - key: PORT
        value: 10000
      - key: JAFJ_MAX_CRASHES
        value: 5
      - key: BOT_TOKEN
        sync: false
      - key: BACKUP_CHAT
        sync: false
    disk:
      name: jafj-data
      mountPath: /data
      sizeGB: 1
